name: Plugin checks

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php8.3-cli
      - name: Lint PHP and JavaScript
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
          find . -type f -name '*.js' -not -path './dist/*' -print0 | xargs -0 -r -n1 node --check
      - name: Build and verify release ZIP
        run: |
          set -euo pipefail
          python3 scripts/release.py
          python3 scripts/release.py --verify dist/digicyfr-service-quote-desk-pl-0.1.1.zip
          (cd dist && sha256sum -c digicyfr-service-quote-desk-pl-0.1.1.zip.sha256)
      - name: WordPress integration
        run: bash tests/run-wordpress-integration.sh dist/digicyfr-service-quote-desk-pl-0.1.1.zip
      - name: Upload checked ZIP
        uses: actions/upload-artifact@v4
        with:
          name: digicyfr-service-quote-desk-pl-candidate
          path: |
            dist/digicyfr-service-quote-desk-pl-0.1.1.zip
            dist/digicyfr-service-quote-desk-pl-0.1.1.zip.sha256
          if-no-files-found: error
