name: digicyfr-wordpress-plugins-test

services:
  database:
    image: ${DIGICYFR_DB_IMAGE:-mariadb@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430}
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-root-test-only
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: ${DIGICYFR_WP_IMAGE:-wordpress:7.1.0-php8.3-apache}
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-test-only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
    ports:
      - "127.0.0.1:${DIGICYFR_TEST_PORT:-18080}:80"
    volumes:
      - wp_data:/var/www/html

volumes:
  db_data:
  wp_data:
